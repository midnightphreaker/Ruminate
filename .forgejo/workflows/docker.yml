name: Release Ruminate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: docker
    container:
      image: git.phrk.org/mcp-servers/runner-image-docker-cli:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION must be X.Y.Z, got: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_ACTOR: ${{ github.actor }}
        run: |
          if [ -n "${REGISTRY_USER:-}" ] && [ -n "${REGISTRY_PASSWORD:-}" ]; then
            printf '%s' "$REGISTRY_PASSWORD" | docker login git.phrk.org -u "$REGISTRY_USER" --password-stdin
          elif [ -n "${FORGEJO_TOKEN:-}" ]; then
            printf '%s' "$FORGEJO_TOKEN" | docker login git.phrk.org -u "${FORGEJO_ACTOR:-forgejo-actions}" --password-stdin
          else
            echo "Set REGISTRY_USER and REGISTRY_PASSWORD secrets, or enable the Forgejo-provided GITHUB_TOKEN." >&2
            exit 1
          fi

          docker build --push \
            --label "org.opencontainers.image.source=https://git.phrk.org/mcp-servers/ruminate" \
            --label "org.opencontainers.image.version=${{ steps.version.outputs.version }}" \
            --iidfile image.iid \
            -t "git.phrk.org/mcp-servers/ruminate:${{ steps.version.outputs.version }}" \
            -t "git.phrk.org/mcp-servers/ruminate:latest" .

      - name: Package release binary
        id: package
        run: |
          set -eu
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"
          mkdir -p "dist/ruminate-${tag}-linux-x86_64"
          container_id="$(docker create "$(cat image.iid)")"
          docker cp "${container_id}:/app/ruminate" "dist/ruminate-${tag}-linux-x86_64/ruminate"
          docker rm "${container_id}"
          cp VERSION README.md "dist/ruminate-${tag}-linux-x86_64/"
          tar -C dist -czf "dist/ruminate-${tag}-linux-x86_64.tar.gz" "ruminate-${tag}-linux-x86_64"
          sha256sum "dist/ruminate-${tag}-linux-x86_64.tar.gz" > "dist/ruminate-${tag}-linux-x86_64.tar.gz.sha256sum"
          previous_tag="$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            git log --pretty=format:'- %s (%h)' "${previous_tag}..HEAD" > "dist/${tag}.changelog"
          else
            git log --pretty=format:'- %s (%h)' HEAD > "dist/${tag}.changelog"
          fi
          if [ ! -s "dist/${tag}.changelog" ]; then
            printf '%s\n' "- Release ${tag}" > "dist/${tag}.changelog"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=dist/ruminate-${tag}-linux-x86_64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/ruminate-${tag}-linux-x86_64.tar.gz.sha256sum" >> "$GITHUB_OUTPUT"
          echo "changelog=dist/${tag}.changelog" >> "$GITHUB_OUTPUT"

      - name: Bump VERSION
        run: |
          old="$(tr -d '[:space:]' < VERSION)"
          major="${old%%.*}"
          rest="${old#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          next="${major}.${minor}.$((patch + 1))"
          printf '%s\n' "$next" > VERSION
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.git.phrk.org"
          git tag -a "${{ steps.package.outputs.tag }}" -m "${{ steps.package.outputs.tag }}"
          git add VERSION
          git commit -m "chore: bump version to $next [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME" "${{ steps.package.outputs.tag }}"

      - name: Push GitHub mirror and release
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TO_GITHUB_PAT: ${{ secrets.PUSH_TO_GITHUB_PAT }}
          GITHUB_MIRROR_URL: https://github.com/midnightphreaker/Ruminate
        run: |
          set -eu
          if ! command -v curl >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache curl git jq
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends curl git jq
            fi
          fi

          if [ -z "${PUSH_TO_GITHUB_PAT:-}" ]; then
            echo "Set the PUSH_TO_GITHUB_PAT secret to a GitHub token with write access to the mirror repository." >&2
            exit 1
          fi

          github_web_url="$(printf '%s' "$GITHUB_MIRROR_URL" | sed 's#\.git$##')"
          github_push_url="$(printf '%s' "$github_web_url" | sed "s#^https://#https://x-access-token:${PUSH_TO_GITHUB_PAT}@#").git"
          github_repo="${github_web_url#https://github.com/}"
          tag="${{ steps.package.outputs.tag }}"

          forgejo_repo_url="${FORGEJO_SERVER_URL%/}/${FORGEJO_REPOSITORY}.git"
          if [ -n "${FORGEJO_TOKEN:-}" ]; then
            clone_url="$(printf '%s' "$forgejo_repo_url" | sed "s#^https://#https://token:${FORGEJO_TOKEN}@#")"
          else
            clone_url="$forgejo_repo_url"
          fi

          git clone --branch "${FORGEJO_REF_NAME:-main}" "$clone_url" mirror
          cd mirror

          forgejo_web_url="${FORGEJO_SERVER_URL%/}/${FORGEJO_REPOSITORY}"
          if [ -f README.md ]; then
            sed -i "s#${forgejo_web_url}#${github_web_url}#g" README.md
            sed -i "s#https://git.phrk.org/mcp-servers/ruminate#${github_web_url}#g" README.md
            sed -i "s#git.phrk.org/mcp-servers/ruminate:[A-Za-z0-9._-]*#${github_web_url}/releases#g" README.md
            sed -i "s#git.phrk.org#github.com/midnightphreaker#g" README.md
            sed -i "s#Forgejo workflow#release workflow#g; s#Forgejo-provided ##g; s#Forgejo release#GitHub release#g" README.md
            sed -i '/^Docker image:/d' README.md
            awk -v release_url="${github_web_url}/releases/latest" '
              /^Run the released container:/ {
                print "Run from source or download release archives from " release_url ":";
                print "";
                print "```bash";
                print "cargo run -p ruminate";
                print "```";
                print "";
                skip = 1;
                next;
              }
              skip && /^Check the health endpoint:/ {
                skip = 0;
              }
              !skip { print }
            ' README.md > README.md.github
            mv README.md.github README.md
          fi

          git config user.name "Forgejo Actions"
          git config user.email "actions@forgejo.local"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: adapt README links for GitHub mirror"
          fi

          git remote add github "$github_push_url"
          git push --force github "HEAD:main"
          git push github --tags

          changelog_file="../${{ steps.package.outputs.changelog }}"
          asset_file="../${{ steps.package.outputs.asset }}"
          checksum_file="../${{ steps.package.outputs.checksum }}"
          body="$(cat "$changelog_file")"
          payload="$(jq -n --arg tag "$tag" --arg name "$tag" --arg body "$body" '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')"
          status="$(curl -sS -o /tmp/github-release.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${PUSH_TO_GITHUB_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -d "$payload" \
            "https://api.github.com/repos/${github_repo}/releases")"
          if [ "$status" = "422" ]; then
            release_id="$(curl -fsS \
              -H "Authorization: Bearer ${PUSH_TO_GITHUB_PAT}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${github_repo}/releases/tags/${tag}" | jq -r '.id')"
          elif [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            release_id="$(jq -r '.id' /tmp/github-release.json)"
          else
            cat /tmp/github-release.json >&2
            exit 1
          fi
          for file in "$asset_file" "$checksum_file" "$changelog_file"; do
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${PUSH_TO_GITHUB_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "https://uploads.github.com/repos/${github_repo}/releases/${release_id}/assets?name=$(basename "$file")" \
              >/dev/null
          done
