[package]
name = "ruminate"
version = "0.6.7"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
reflect = ["dep:reqwest"]

[dependencies]
anyhow = "1"
axum = "0.8"
rmcp = { version = "2.0.0", features = ["client", "server", "macros", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", features = ["json", "rustls"], optional = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
